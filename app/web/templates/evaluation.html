{% extends "base.html" %}

{% block title %}Evaluation Results — AI DevGuard{% endblock %}

{% block content %}
<style>
.eval-page-wrap { padding: 0.5rem 0 2rem; }
.eval-section { margin-bottom: 2.5rem; }
.eval-section h2 {
    font-size: 1.25rem;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 1rem;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.eval-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.eval-table th {
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 0.85rem 1rem;
    text-align: left;
    border-bottom: 1px solid var(--border-glass);
    white-space: nowrap;
}
.eval-table td {
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--border-glass-subtle);
    color: #ffffff;
    vertical-align: middle;
}
.eval-table tr.our-system td {
    background: rgba(34, 197, 94, 0.08);
    font-weight: 700;
    color: #4ade80;
}
.eval-table tr:hover td {
    background: rgba(255, 255, 255, 0.04);
}
.chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.5rem;
    margin-top: 1.5rem;
}
.chart-box {
    background: rgba(9, 20, 42, 0.65);
    border: 1px solid var(--border-glass);
    border-radius: 16px;
    padding: 1.35rem;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
.eval-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
    font-family: var(--font-mono);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-glass-subtle);
    border-radius: 8px;
    padding: 0.5rem 1rem;
    display: inline-block;
}
</style>

<div class="eval-page-wrap">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
            <h1 style="font-size: 1.85rem; font-weight: 800; color: #ffffff; letter-spacing: -0.5px;">Evaluation Benchmark</h1>
            <p style="color: var(--text-muted); margin-top: 0.4rem; font-size: 0.92rem;">
                Research Q: Does LLM + Rules outperform rules-only or raw LLM baselines?
            </p>
        </div>
        <button class="btn btn-cream" hx-post="/dashboard/evaluation/run" hx-target="#eval-body" hx-swap="outerHTML" hx-indicator="#eval-spin">
            <span id="eval-spin" class="htmx-indicator" style="font-size: 13px;">&circlearrowright;</span>
            <span>Run Benchmark Suite</span>
        </button>
    </div>

    <div id="eval-body">
        {% include "partials/eval_tables.html" %}
    </div>
</div>
{% endblock %}
